# Runs BEYOND's whole test suite on Windows for every push to main and every pull request, so each change shows a
# ✓ or ✗ before it's merged. The tests use stand-ins for the AI, the web and Hugging Face, so no model is needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:                # a newer push to the same branch or pull request replaces a run still going
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Code blocks, Chromium
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Install browser test tools (development only)
        working-directory: tests/web
        run: npm ci
      - name: Install Chromium
        working-directory: tests/web
        run: npx playwright install chromium
      - name: Check parser and filename handling
        working-directory: tests/web
        run: npm test
      - name: Check chat rendering, copy, downloads and safety
        working-directory: tests/web
        env:
          BEYOND_SCREENSHOT: ${{ runner.temp }}/code-blocks-mobile.png
        run: npm run test:browser

  tests:
    name: Windows, Python 3.14
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the exact versions BEYOND is tested with
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      # Voice input never downloads its model by itself (Add-Features.cmd installs it), so fetch Whisper "base"
      # here, once, for the tests that turn real speech into text. Cached between runs.
      - name: Cache the voice input model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-base-v1

      - name: Download the voice input model
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8')"

      - name: Run the tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
