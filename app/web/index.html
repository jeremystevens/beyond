<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget: Android Chrome shrinks the page when the keyboard opens, instead of covering it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <title>BEYOND</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
  <script src="/static/app-height.js?v=3" defer></script>
  <style>
    .layout { flex: 1; display: flex; min-height: 0; position: relative; }
    aside {
      width: 270px; flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px;
      background: var(--panel); border-right: 1px solid var(--border); min-height: 0;
    }
    aside .newchat { width: 100%; }
    #chats { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex;
             flex-direction: column; gap: 2px; }
    #chats li { display: flex; align-items: center; border-radius: 10px; }
    #chats li:hover, #chats li.active { background: var(--bg); }
    #chats li.active { outline: 1px solid var(--border); }
    .item { flex: 1; min-width: 0; text-align: left; background: none; color: var(--text); padding: 8px 10px;
            font-weight: 400; border-radius: 10px; }
    .item .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
    .item .d { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .act { background: none; color: var(--muted); padding: 6px 7px; font-weight: 400; font-size: 0.85rem;
           visibility: hidden; border-radius: 8px; }
    #chats li:hover .act, #chats li.active .act, .act:focus { visibility: visible; }
    .act:hover { color: var(--text); background: var(--panel); }
    .empty { color: var(--muted); font-size: 0.85rem; padding: 8px 10px; }
    .menu { display: none; }
    .chatcol { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    /* only the conversation scrolls; reaching its end doesn't scroll the whole page instead */
    #log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 16px; }
    html, body { overflow: hidden; overscroll-behavior: none; }
    form { flex: none; }
    .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .welcome { text-align: center; color: var(--muted); margin: 12vh auto 0; max-width: 460px; line-height: 1.5; }
    .welcome h1 { color: var(--text); font-size: 1.4rem; margin: 0 0 6px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
           white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--accent); color: var(--accent-text);
            border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bubble); border: 1px solid var(--border);
                 border-bottom-left-radius: 4px; }
    .error { align-self: center; background: var(--error-bg); color: var(--text); border: 1px solid var(--bad);
             font-size: 0.9rem; max-width: 95%; }
    .thinking { color: var(--muted); }
    .thinking::after { content: '…'; display: inline-block; animation: pulse 1.2s infinite; }
    .writing::after { content: '▍'; margin-left: 1px; color: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .note { display: block; margin-top: 6px; font-size: 0.8rem; color: var(--muted); font-style: italic; }
    .assistant.command { border-style: dashed; font-size: 0.92rem; }   /* BEYOND's own reply to a /command */
    .assistant.reminder { border-color: var(--accent); border-width: 2px; }   /* a reminder that went off */
    .reminder-banner { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%);
                       top: calc(var(--view-top, 0px) + 64px); width: min(520px, calc(100vw - 32px));
                       display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px;
                       background: var(--panel); color: var(--text); border: 2px solid var(--accent);
                       box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
    .reminder-banner span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .note-msg { align-self: flex-start; background: transparent; color: var(--muted); font-size: 0.85rem;
                padding: 4px 6px; margin-top: -4px; }
    #photo-preview { max-width: 760px; margin: 0 auto 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #photo-preview[hidden] { display: none; }
    #photo-thumb { max-width: 80px; max-height: 80px; object-fit: contain; border-radius: 8px; }
    #photo-status { flex: 1; min-width: 100px; font-size: 0.85rem; color: var(--muted); }
    body.photo-drag .chatcol { outline: 3px dashed var(--accent); outline-offset: -5px; }
    .scan-copy { display: block; margin-top: 10px; }
    .user .picture { image-rendering: auto; }
    .picture { display: block; margin-top: 10px; width: 260px; max-width: 100%; height: auto; border-radius: 8px;
               image-rendering: pixelated; background: #fff; }
    .lookup { display: block; margin-top: 10px; font-size: 0.82rem; color: var(--muted); white-space: normal; }
    .lookup summary { cursor: pointer; }
    .lookup .sources { margin-top: 6px; padding: 8px 10px; border-left: 2px solid var(--border); white-space: pre-wrap;
                       max-height: 260px; overflow: auto; }
    .msg a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
    .buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; white-space: normal; }
    .buttons .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 5px 12px; font-size: 0.85rem; font-weight: 500; border-radius: 999px; background: var(--bg);
            color: var(--text); border: 1px solid var(--border); }
    .chip:hover:not(:disabled) { border-color: var(--accent); }
    .msg a.chip { text-decoration: none; display: inline-flex; align-items: center; }
    .toast { display: block; margin-top: 8px; font-size: 0.82rem; color: var(--muted); transition: opacity 0.4s; }
    .user .note { color: var(--accent-text); opacity: 0.85; }
    form { background: var(--panel); border-top: 1px solid var(--border);
           /* room for the iPhone home bar and, sideways, the notch */
           padding: 12px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom))
                    max(16px, env(safe-area-inset-left)); }
    #backdrop { display: none; }
    .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; position: relative; }
    #cmdmenu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); max-height: 320px; overflow-y: auto;
               margin: 0; padding: 6px; list-style: none; background: var(--panel); border: 1px solid var(--border);
               border-radius: 12px; box-shadow: 0 -4px 16px rgba(0,0,0,0.12); z-index: 3; }
    #cmdmenu[hidden] { display: none; }
    #cmdmenu li { padding: 8px 10px; border-radius: 8px; cursor: pointer; line-height: 1.35; }
    #cmdmenu li.on, #cmdmenu li:hover { background: var(--bg); }
    #cmdmenu b { color: var(--accent); }
    #cmdmenu .s { color: var(--text); font-size: 0.9rem; }
    #cmdmenu .e { display: block; color: var(--muted); font-size: 0.8rem; }
    textarea { flex: 1; min-width: 0; resize: none; max-height: 200px; overflow-y: auto; scrollbar-width: thin; line-height: 1.4; }
    @media (max-width: 760px) {
      .menu { display: inline-block; }
      aside { position: absolute; z-index: 5; top: 0; bottom: 0; left: 0; width: min(300px, 85vw);
              transform: translateX(-105%); transition: transform 0.2s; box-shadow: 4px 0 16px rgba(0,0,0,0.15);
              padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      body.panel-open aside { transform: none; }
      /* a dimmed backdrop behind the open chat list: tap it to close the list */
      body.panel-open #backdrop { display: block; position: absolute; inset: 0; z-index: 4;
                                  background: rgba(0, 0, 0, 0.35); }
      .act { visibility: visible; }
      #log { padding: 14px 12px; }
      .msg { max-width: 92%; }
      .welcome { margin-top: 8vh; }
      #cmdmenu { max-height: 45dvh; }
    }
    /* touch screens: bigger targets for thumbs */
    @media (pointer: coarse) {
      .chip { padding: 9px 14px; font-size: 0.9rem; min-height: 40px; }
      .act { min-width: 40px; min-height: 40px; font-size: 1rem; }
      .item { padding: 10px 10px; }
      #cmdmenu li { padding: 11px 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="right" style="gap: 10px">
      <button class="ghost menu" id="menu" type="button" aria-label="Show chats">☰</button>
      <div class="brand">BEYOND</div>
    </div>
    <div class="right">
      <div class="status" title="AI server status"><span class="dot" id="dot"></span><span id="status">Checking the AI…</span></div>
      <a class="ghost button" href="/settings">Settings</a>
    </div>
  </header>
  <div class="layout">
    <div id="backdrop" aria-hidden="true"></div>
    <aside aria-label="Saved chats">
      <button class="newchat" id="newchat" type="button">＋ New chat</button>
      <ul id="chats"></ul>
    </aside>
    <div class="chatcol">
      <main id="log"><div class="inner" id="messages"></div></main>
      <form id="form">
        <div id="photo-preview" hidden>
          <img id="photo-thumb" alt="Attached photo">
          <span id="photo-status" role="status"></span>
          <button type="button" id="read-photo">Read text</button>
          <button type="button" class="ghost" id="remove-photo" aria-label="Remove attached photo">Remove</button>
        </div>
        <input id="photo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <div class="composer">
          <button type="button" class="ghost" id="attach-photo" aria-label="Attach a photo" title="Attach a photo to read its text">📷</button>
          <ul id="cmdmenu" role="listbox" aria-label="Commands" hidden></ul>
          <textarea id="input" rows="1" placeholder="Message BEYOND…  (type / for commands)" aria-label="Message"
                    title="Enter sends · Shift+Enter starts a new line · / shows the commands"
                    aria-controls="cmdmenu" aria-autocomplete="list"></textarea>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    let chatId = null;    // the open saved chat (null = a new chat that isn't saved until its first message)
    let current = null;   // the reply being written: { controller, stopped }
    let scanning = false;
    let titles = {};      // chat id -> title, from the last list refresh
    const $ = id => document.getElementById(id);
    const log = $('log'), list = $('messages'), input = $('input'), send = $('send');
    const WELCOME = '<div class="welcome" id="welcome"><h1>Hi, I\'m BEYOND.</h1>' +
                    'Ask me anything. I run entirely on your own computer.</div>';

    // ---------- small helpers ----------
    function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
    function scrollDown(force) { if (force || nearBottom()) log.scrollTop = log.scrollHeight; }

    // Plain text on purpose: nothing the AI or a web result writes is run as HTML. Web addresses become links
    // (built as elements, only http/https, opened in a new tab without access back to BEYOND).
    function fill(el, text) {
      el.textContent = '';
      let last = 0;
      for (const m of text.matchAll(/https?:\/\/[^\s<>"'“”‘’«»]+/g)) {
        const url = m[0].replace(/[.,;:!?)\]}]+$/, '');
        el.append(text.slice(last, m.index));
        const a = document.createElement('a');
        a.href = url; a.textContent = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        el.append(a);
        last = m.index + url.length;
      }
      el.append(text.slice(last));
    }

    function bubble(kind, text) {
      $('welcome')?.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      fill(el, text);
      list.appendChild(el);
      scrollDown(true);
      return el;
    }

    // ---------- buttons under a message ----------
    function showButtons(el, messageId, buttons) {
      el.querySelector('.buttons')?.remove();
      if (!buttons || !buttons.length) return;
      const box = document.createElement('div');
      box.className = 'buttons';
      for (const row of buttons) {
        const line = document.createElement('div');
        line.className = 'row';
        for (const b of row) {
          if (b.url && b.url.startsWith('/api/')) {   // a download link (e.g. 📄 Download CSV), only to BEYOND itself
            const link = document.createElement('a');
            link.className = 'chip'; link.href = b.url; link.textContent = b.label; link.download = '';
            line.appendChild(link);
            continue;
          }
          const chip = document.createElement('button');
          chip.type = 'button'; chip.className = 'chip';
          chip.textContent = b.label;
          // 🔄 Try again writes a whole new answer, so it streams like a question instead of changing this message.
          const retry = b.action.startsWith('rate:retry:');
          if (retry) chip.dataset.retry = '1';
          chip.onclick = () => retry ? tryAgain(el, messageId, buttons) : press(el, messageId, b.action);
          line.appendChild(chip);
        }
        box.appendChild(line);
      }
      el.appendChild(box);
    }

    async function press(el, messageId, action) {
      el.querySelectorAll('.chip').forEach(c => c.disabled = true);
      try {
        const r = await fetch(`/api/messages/${messageId}/press`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Something went wrong.');
        fill(el, data.text);   // the message changes in place (plain text, as always)
        showButtons(el, messageId, data.buttons);
        if (data.toast) {
          const toast = document.createElement('span');
          toast.className = 'toast';
          toast.textContent = data.toast;
          el.appendChild(toast);
          setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 4000);
        }
      } catch (e) {
        el.querySelectorAll('.chip').forEach(c => c.disabled = false);
        bubble('error', e.message);
      }
    }

    // A picture under a message (e.g. a /qr code). Only BEYOND's own data: images are shown.
    function showImage(el, src) {
      if (!src || !src.startsWith('data:image/png;base64,') || el.querySelector('.picture')) return;
      const img = document.createElement('img');
      img.className = 'picture'; img.src = src; img.alt = el.classList.contains('user') ? 'Uploaded photo' : 'QR code';
      el.insertBefore(img, el.querySelector('.lookup, .buttons'));
    }

    // "🔎 Looked up: …" under an answer (written by BEYOND, not the AI); tap it to see exactly what was found.
    function showLookup(el, lookup) {
      if (!lookup || el.querySelector('.lookup')) return;
      const box = document.createElement(lookup.ok ? 'details' : 'div');
      box.className = 'lookup';
      if (lookup.ok) {
        const summary = document.createElement('summary');
        summary.textContent = '🔎 Looked up: ' + lookup.source;
        const raw = document.createElement('div');
        raw.className = 'sources';
        fill(raw, lookup.raw);
        box.append(summary, raw);
      } else {
        box.textContent = `⚠️ I tried to look this up (${lookup.source}) but couldn't just now, so this isn't checked against current information.`;
      }
      el.insertBefore(box, el.querySelector('.buttons'));
    }

    function noteBubble(text) {   // a small note from BEYOND itself, e.g. "🧠 Noted for next time"
      const el = document.createElement('div');
      el.className = 'msg note-msg';
      el.textContent = text;
      list.appendChild(el);
      return el;
    }

    function addNote(el, text) {
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = text;
      el.appendChild(note);
      return note;
    }

    function setBusy(busy) {
      send.textContent = busy ? 'Stop' : 'Send';
      send.classList.toggle('stop', busy);
      send.type = busy ? 'button' : 'submit';
      send.title = busy ? 'Stop the answer (Esc)' : '';
    }

    function stop() { if (current) { current.stopped = true; current.controller.abort(); } }

    function when(iso) {
      const d = new Date(iso), now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const days = (now - d) / 86400000;
      if (days < 7) return d.toLocaleDateString([], { weekday: 'long' });
      return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
    }

    async function api(url, options = {}) {
      const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Something went wrong.');
      return data;
    }

    // ---------- the list of saved chats ----------
    async function loadList() {
      let items = [];
      try { items = await api('/api/chats'); } catch { return; }
      titles = {};
      const ul = $('chats');
      ul.innerHTML = '';
      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'No saved chats yet. Your conversations will appear here.';
        ul.appendChild(li);
      }
      for (const c of items) {
        titles[c.id] = c.title;
        const li = document.createElement('li');
        if (c.id === chatId) li.className = 'active';
        const open = document.createElement('button');
        open.type = 'button'; open.className = 'item';
        const t = document.createElement('span'); t.className = 't'; t.textContent = c.title;
        const d = document.createElement('span'); d.className = 'd'; d.textContent = when(c.updated_at);
        open.append(t, d);
        open.onclick = () => openChat(c.id);
        const ren = document.createElement('button');
        ren.type = 'button'; ren.className = 'act'; ren.textContent = '✎';
        ren.title = ren.ariaLabel = 'Rename "' + c.title + '"';
        ren.onclick = () => renameChat(c.id);
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'act'; del.textContent = '🗑';
        del.title = del.ariaLabel = 'Delete "' + c.title + '"';
        del.onclick = () => deleteChat(c.id);
        li.append(open, ren, del);
        ul.appendChild(li);
      }
    }

    function showChatInAddress() { history.replaceState(null, '', chatId ? '#chat=' + chatId : location.pathname); }

    function newChat() {
      stop();
      clearPhoto();
      chatId = null;
      list.innerHTML = WELCOME;
      showChatInAddress();
      loadList();
      document.body.classList.remove('panel-open');
      input.focus();
    }

    async function openChat(id) {
      stop();
      clearPhoto();
      document.body.classList.remove('panel-open');
      let chat;
      try { chat = await api('/api/chats/' + id); }
      catch (e) { newChat(); bubble('error', e.message); return; }
      chatId = chat.id;
      list.innerHTML = '';
      if (!chat.messages.length) list.innerHTML = WELCOME;
      for (const m of chat.messages) {
        if (m.kind === 'note') { noteBubble(m.content); continue; }
        const el = bubble(m.role + (m.kind === 'command' && m.role === 'assistant' ? ' command' : '') +
                          (['reminder', 'briefing'].includes(m.kind) ? ' reminder' : ''), m.content);
        if (m.stopped) addNote(el, 'Stopped');
        if (m.kind === 'retried') addNote(el, RETRIED);
        showLookup(el, m.lookup);
        showImage(el, m.image);
        if (m.kind === 'scan') showCopy(el, m.content);
        showButtons(el, m.id, m.buttons);
      }
      scrollDown(true);
      showChatInAddress();
      loadList();
      input.focus();
    }

    async function renameChat(id) {
      const title = prompt('New name for this chat:', titles[id] || '');
      if (title === null) return;
      try { await api('/api/chats/' + id, { method: 'PATCH', body: JSON.stringify({ title }) }); }
      catch (e) { alert(e.message); }
      loadList();
    }

    async function deleteChat(id) {
      if (!confirm('Delete "' + (titles[id] || 'this chat') + '"? This can\'t be undone.')) return;
      try { await api('/api/chats/' + id, { method: 'DELETE' }); }
      catch (e) { alert(e.message); }
      if (id === chatId) newChat(); else loadList();
    }

    // ---------- AI status ----------
    function setStatus(state, text) {
      $('dot').className = 'dot ' + state;
      $('status').textContent = text;
      $('dot').parentElement.title = text;   // on phones only the dot shows; the text is its tooltip
    }

    async function refreshStatus() {
      try {
        const s = await (await fetch('/api/ai-status')).json();
        if (s.state === 'ok') setStatus('ok', 'AI connected' + (s.model ? ' · ' + s.model.replace(/\.gguf$/i, '') : ''));
        else if (s.state === 'not_set') setStatus('warn', 'No AI set up yet');
        else setStatus('bad', "Can't reach the AI");
      } catch { setStatus('bad', 'BEYOND is not responding'); }
    }

    // ---------- sending ----------
    function autoGrow() {
      input.style.height = 'auto';
      const needed = input.scrollHeight + 2;   // + the 1px top and bottom border
      input.style.height = Math.min(needed, 200) + 'px';
      input.style.overflowY = needed > 200 ? 'auto' : 'hidden';   // a scrollbar only once the box is full
    }
    // ---------- the "/" command list ----------
    let commandList = [], menuItems = [], menuIndex = 0;
    fetch('/api/commands').then(r => r.json()).then(list => { commandList = list; }).catch(() => {});
    const menu = $('cmdmenu');

    function updateMenu() {
      const text = input.value;
      const typing = /^\/\S*$/.test(text);   // a "/" and the start of a command name, no space yet
      const word = text.slice(1).toLowerCase();
      menuItems = typing ? commandList.filter(c => c.name.startsWith(word))
                                      .concat(commandList.filter(c => !c.name.startsWith(word) &&
                                              (c.name.includes(word) || c.summary.toLowerCase().includes(word)))) : [];
      if (!menuItems.length) { menu.hidden = true; return; }
      menuIndex = Math.min(menuIndex, menuItems.length - 1);
      menu.innerHTML = '';
      menuItems.forEach((c, i) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        if (i === menuIndex) { li.className = 'on'; li.setAttribute('aria-selected', 'true'); }
        const name = document.createElement('b'); name.textContent = '/' + c.name;
        const summary = document.createElement('span'); summary.className = 's'; summary.textContent = ' — ' + c.summary;
        const example = document.createElement('span'); example.className = 'e'; example.textContent = c.example;
        li.append(name, summary, example);
        li.onmousedown = e => { e.preventDefault(); pickCommand(i); };
        menu.appendChild(li);
      });
      menu.hidden = false;
      menu.children[menuIndex]?.scrollIntoView({ block: 'nearest' });
    }

    function pickCommand(i) {
      input.value = '/' + menuItems[i].name + ' ';
      menuIndex = 0;
      menu.hidden = true;
      autoGrow();
      input.focus();
    }

    input.addEventListener('input', () => { autoGrow(); menuIndex = 0; updateMenu(); });
    input.addEventListener('blur', () => { menu.hidden = true; });
    input.addEventListener('keydown', e => {
      if (!menu.hidden) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          menuIndex = (menuIndex + (e.key === 'ArrowDown' ? 1 : -1) + menuItems.length) % menuItems.length;
          updateMenu();
          return;
        }
        if (e.key === 'Tab') { e.preventDefault(); pickCommand(menuIndex); return; }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); menu.hidden = true; return; }
        // Enter picks the highlighted command, unless that whole command is already typed (then it sends).
        if (e.key === 'Enter' && !e.shiftKey && input.value.trim().toLowerCase() !== '/' + menuItems[menuIndex].name) {
          e.preventDefault(); pickCommand(menuIndex); return;
        }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); menu.hidden = true; if (!current) $('form').requestSubmit(); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });
    send.addEventListener('click', e => { if (current) { e.preventDefault(); stop(); } });
    $('newchat').addEventListener('click', newChat);
    $('menu').addEventListener('click', () => document.body.classList.toggle('panel-open'));
    $('backdrop').addEventListener('click', () => document.body.classList.remove('panel-open'));

    const RETRIED = '🔄 Tried again below';

    $('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (current || scanning) return;
      if (pendingPhoto) {
        if (text && text.toLowerCase() !== '/scan') {
          $('photo-status').textContent = 'Choose Read text or send /scan for this photo. Photo descriptions arrive in Phase 22.';
          return;
        }
        input.value = ''; autoGrow(); readPhoto(); return;
      }
      if (!text) return;
      input.value = ''; autoGrow();
      const question = bubble('user', text);
      streamAnswer('/api/chat/stream', { chat_id: chatId, content: text }, question, () => {
        // nothing was answered, so BEYOND didn't save the question either
        if (current?.stopped && question.isConnected) addNote(question, 'Stopped before the AI started answering (not saved)');
      });
    });

    // 🔄 Try again: the old answer stays (marked), and a different one streams in below it.
    function tryAgain(el, messageId, buttons) {
      if (current || scanning) return;
      el.querySelector('.buttons')?.remove();
      const note = addNote(el, RETRIED);
      streamAnswer(`/api/messages/${messageId}/retry`, null, el, () => {
        note.remove();   // no new answer: BEYOND put the old one back
        showButtons(el, messageId, buttons);
      });
    }

    // Send a request that answers with a stream of events, and show the answer as it's written.
    // `anchor`: the message this answer belongs to; `nothing()`: runs if no answer was written at all.
    async function streamAnswer(url, payload, anchor, nothing) {
      const reply = bubble('assistant thinking', '');
      current = { controller: new AbortController(), stopped: false, chatId };
      const mine = current;
      setBusy(true);
      let answer = '', problem = null, startedNewChat = false, finished = false, lookup = null;
      // Called once the answer is complete ("done"), or when the stream ends: lets you type again. A "Noted for
      // next time" note may still arrive afterwards on the same connection.
      function finish() {
        if (finished) return;
        finished = true;
        reply.classList.remove('writing', 'thinking');
        if (answer) {
          if (mine.stopped) addNote(reply, 'Stopped');
          showLookup(reply, lookup);
        } else {
          reply.remove();
          if (anchor.isConnected) nothing();
          if (startedNewChat && chatId === mine.chatId) { chatId = null; showChatInAddress(); }   // BEYOND removed it again
        }
        if (problem && anchor.isConnected) { bubble('error', problem); refreshStatus(); }
        if (current === mine) current = null;
        setBusy(false);
        loadList();
        input.focus();
      }
      try {
        const response = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: payload ? JSON.stringify(payload) : undefined, signal: mine.controller.signal,
        });
        if (!response.ok) throw new Error((await response.json()).error || 'Something went wrong.');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let newline;
          while ((newline = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, newline).trim();
            buffer = buffer.slice(newline + 1);
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === 'chat') {
              if (event.new) { chatId = mine.chatId = event.id; startedNewChat = true; showChatInAddress(); loadList(); }
            } else if (event.type === 'token') {
              const follow = nearBottom();
              if (!answer) reply.className = 'msg assistant writing' + (event.kind === 'command' ? ' command' : '');
              answer += event.text;
              fill(reply, answer);
              if (follow) scrollDown(true);
            } else if (event.type === 'status' && !answer) {
              reply.textContent = event.text;   // "🔎 Checking the weather for Paris…" until the answer starts
            } else if (event.type === 'replace') {
              answer = event.text;   // BEYOND tidied the finished answer (removed a "Looked up" line the AI wrote)
              fill(reply, answer);
            } else if (event.type === 'lookup') {
              lookup = event;
            } else if (event.type === 'question') {
              if (anchor.classList.contains('user')) fill(anchor, event.text);   // e.g. the Wi-Fi password hidden
            } else if (event.type === 'message') {
              showLookup(reply, lookup);
              showImage(reply, event.image);
              // 🔄 is only offered on the newest answer
              if (event.buttons.some(row => row.some(b => (b.action || '').startsWith('rate:retry:'))))
                list.querySelectorAll('.chip[data-retry]').forEach(c => c.remove());
              showButtons(reply, event.id, event.buttons);
            } else if (event.type === 'error') {
              problem = event.message;
            } else if (event.type === 'done') {
              finish();
            } else if (event.type === 'note' && chatId === mine.chatId && reply.isConnected) {
              const follow = nearBottom();
              noteBubble(event.text);   // "🧠 Noted for next time: …", only if you're still in that chat
              if (follow) scrollDown(true);
            }
          }
        }
      } catch (err) {
        if (!mine.stopped && !finished) problem = err.message && err.name !== 'TypeError' ? err.message
                                                                                          : 'BEYOND is not responding. Is it still running?';
      } finally {
        finish();
      }
    }


    // ---------- photos and /scan ----------
    let pendingPhoto = null, previewUrl = null;
    function clearPhoto() {
      pendingPhoto = null;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      $('photo-preview').hidden = true;
      $('photo-thumb').removeAttribute('src');
      $('photo-file').value = '';
    }
    function choosePhoto(files) {
      if (current || scanning) { bubble('error', 'Wait for this answer to finish before attaching a photo.'); return; }
      if (!files || !files.length) return;
      if (files.length !== 1) { bubble('error', 'Choose one photo at a time.'); return; }
      const file = files[0];
      if (!/\.(png|jpe?g|webp)$/i.test(file.name) && !['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
        bubble('error', 'Choose a PNG, JPEG or WebP photo.'); return;
      }
      if (!file.size || file.size > 10 * 1024 * 1024) { bubble('error', 'Choose a photo up to 10 MB.'); return; }
      clearPhoto();
      pendingPhoto = file;
      previewUrl = URL.createObjectURL(file);
      $('photo-thumb').src = previewUrl;
      $('photo-status').textContent = 'Photo attached. Read its text locally; the photo and result will be saved in this chat.';
      $('photo-preview').hidden = false;
    }
    function showCopy(el, text) {
      const copy = document.createElement('button');
      copy.type = 'button'; copy.className = 'chip scan-copy'; copy.textContent = 'Copy text';
      copy.onclick = async () => {
        try {
          if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
          else {
            const area = document.createElement('textarea');
            area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
            document.body.appendChild(area); area.focus(); area.select();
            const ok = document.execCommand('copy'); area.remove();
            if (!ok) throw new Error('Copy not available');
          }
          copy.textContent = 'Copied';
        } catch {
          const range = document.createRange(); range.selectNodeContents(el);
          const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
          copy.textContent = 'Text selected — copy with your device';
        }
      };
      el.appendChild(copy);
    }
    async function readPhoto() {
      if (!pendingPhoto || current || scanning) return;
      const file = pendingPhoto, originChat = chatId;
      scanning = true;
      for (const id of ['send', 'attach-photo', 'read-photo', 'remove-photo']) $(id).disabled = true;
      $('photo-status').textContent = 'Reading text on this PC… The first scan may take a little longer.';
      const progress = bubble('assistant thinking', 'Reading text from the photo…');
      try {
        const response = await fetch('/api/scan' + (originChat === null ? '' : '?chat_id=' + originChat),
                                     { method: 'POST', body: file, headers: { 'Content-Type': file.type || 'application/octet-stream' } });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'The photo could not be read.');
        if (progress.isConnected && chatId === originChat) {
          progress.remove();
          chatId = data.chat_id; showChatInAddress();
          const photo = bubble('user', 'Photo for /scan'); showImage(photo, data.image);
          const answer = bubble('assistant command', data.text);
          if (data.has_text) showCopy(answer, data.text);
          addNote(answer, 'Read locally · ' + data.seconds + ' seconds');
          clearPhoto(); scrollDown(true);
        }
        loadList();
      } catch (error) {
        if (progress.isConnected) { progress.remove(); bubble('error', error.message); }
        if (pendingPhoto === file) $('photo-status').textContent = 'Could not read this photo. Try again or choose another.';
      } finally {
        progress.remove(); scanning = false;
        for (const id of ['send', 'attach-photo', 'read-photo', 'remove-photo']) $(id).disabled = false;
      }
    }
    $('attach-photo').onclick = () => { if (!current && !scanning) $('photo-file').click(); };
    $('photo-file').onchange = () => choosePhoto($('photo-file').files);
    $('remove-photo').onclick = clearPhoto;
    $('read-photo').onclick = readPhoto;
    document.addEventListener('dragover', event => {
      if (!event.dataTransfer.types.includes('Files')) return;
      event.preventDefault(); document.body.classList.add('photo-drag');
    });
    document.addEventListener('dragleave', event => {
      if (!event.relatedTarget) document.body.classList.remove('photo-drag');
    });
    document.addEventListener('drop', event => {
      if (!event.dataTransfer.types.includes('Files')) return;
      event.preventDefault(); document.body.classList.remove('photo-drag');
      choosePhoto(event.dataTransfer.files);
    });


    // ---------- start ----------
    const fromAddress = /^#chat=(\d+)$/.exec(location.hash);
    if (fromAddress) openChat(Number(fromAddress[1])); else newChat();
    refreshStatus();
    setInterval(refreshStatus, 30000);

    // ---------- reminders that go off ----------
    // BEYOND posts a due reminder in its chat; the page asks every few seconds whether one went off since it last
    // looked. In the open chat it appears as a message; otherwise a banner offers to open that chat.
    let reminderMark = -1;
    const pageTitle = document.title;
    async function checkReminders() {
      let data;
      try { data = await api('/api/reminders/fired?after=' + reminderMark); } catch { return; }
      if (reminderMark >= 0) data.items.forEach(showReminder);
      reminderMark = data.latest;
    }
    function showReminder(r) {
      if (r.chat_id === chatId) {
        const el = bubble('assistant reminder', r.content);
        showButtons(el, r.id, r.buttons);
      } else {
        document.querySelector('.reminder-banner')?.remove();
        const banner = document.createElement('div');
        banner.className = 'reminder-banner';
        banner.setAttribute('role', 'alert');
        const text = document.createElement('span');
        text.textContent = r.content.split('\n')[0] + (r.chat_title ? `  (in “${r.chat_title}”)` : '');
        const open = document.createElement('button');
        open.type = 'button'; open.className = 'chip'; open.textContent = 'Open';
        open.onclick = () => { banner.remove(); openChat(r.chat_id); };
        const close = document.createElement('button');
        close.type = 'button'; close.className = 'chip'; close.textContent = '✕'; close.ariaLabel = 'Dismiss';
        close.onclick = () => banner.remove();
        banner.append(text, open, close);
        document.body.appendChild(banner);
      }
      document.title = '⏰ ' + pageTitle;   // shows in the tab until you come back to it
      loadList();
    }
    const titleBack = () => { if (!document.hidden) document.title = pageTitle; };
    document.addEventListener('visibilitychange', titleBack);
    window.addEventListener('focus', titleBack);
    checkReminders();
    setInterval(checkReminders, 5000);

    // ---------- "I'm on screen" ----------
    // Windows popups only come when you're not looking at BEYOND: tell the server while this page is visible.
    function reportPresence() {
      const visible = document.visibilityState === 'visible' && document.hasFocus();
      fetch('/api/presence', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify({ visible }), keepalive: true }).catch(() => {});
    }
    document.addEventListener('visibilitychange', reportPresence);
    window.addEventListener('focus', reportPresence);
    window.addEventListener('blur', reportPresence);
    reportPresence();
    setInterval(() => { if (document.visibilityState === 'visible' && document.hasFocus()) reportPresence(); }, 10000);
    autoGrow();
  </script>
</body>
</html>
