<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEYOND</title>
  <style>
    :root {
      --bg: #f6f4f1; --panel: #ffffff; --text: #1d1b19; --muted: #6b6560; --accent: #d9622b; --accent-text: #ffffff;
      --ok: #2f8f4e; --warn: #c08a1b; --bad: #c0392b; --border: #e6e1db; --bubble: #ffffff; --error-bg: #fbecea;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141210; --panel: #1b1916; --text: #f1ece6; --muted: #a39b93; --accent: #e8743a;
              --accent-text: #ffffff; --ok: #5cc27e; --warn: #e0b04a; --bad: #e57368; --border: #2e2a26;
              --bubble: #221f1b; --error-bg: #3a2220; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 15px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; letter-spacing: 0.18em; color: var(--accent); font-size: 1.15rem; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem;
              min-width: 0; }
    .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
    #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
    .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .welcome { text-align: center; color: var(--muted); margin: 12vh auto 0; max-width: 460px; line-height: 1.5; }
    .welcome h1 { color: var(--text); font-size: 1.4rem; margin: 0 0 6px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
           white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--accent); color: var(--accent-text);
            border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bubble); border: 1px solid var(--border);
                 border-bottom-left-radius: 4px; }
    .error { align-self: center; background: var(--error-bg); color: var(--text); border: 1px solid var(--bad);
             font-size: 0.9rem; max-width: 95%; }
    .thinking { color: var(--muted); }
    .thinking::after { content: '…'; display: inline-block; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    form { padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--border); }
    .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; max-height: 200px; overflow-y: auto; scrollbar-width: thin;
      padding: 10px 12px; border-radius: 12px; font: inherit;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); line-height: 1.4;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      padding: 10px 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="brand">BEYOND</div>
    <div class="status" title="AI server status"><span class="dot" id="dot"></span><span id="status">Checking the AI…</span></div>
  </header>
  <main id="log"><div class="inner" id="messages">
    <div class="welcome" id="welcome">
      <h1>Hi, I'm BEYOND.</h1>
      Ask me anything. I run entirely on your own computer.
    </div>
  </div></main>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message BEYOND…" aria-label="Message"
                title="Enter sends · Shift+Enter starts a new line"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
  <script>
    const history = [];   // this chat's messages; saving chats arrives in Phase 5
    const $ = id => document.getElementById(id);
    const log = $('log'), list = $('messages'), input = $('input'), send = $('send');

    function bubble(kind, text) {
      $('welcome')?.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      el.textContent = text;   // plain text on purpose: nothing the AI writes is run as HTML
      list.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function setStatus(state, text) {
      $('dot').className = 'dot ' + state;
      $('status').textContent = text;
    }

    async function refreshStatus() {
      try {
        const s = await (await fetch('/api/ai-status')).json();
        if (s.state === 'ok') setStatus('ok', 'AI connected' + (s.model ? ' · ' + s.model.replace(/\.gguf$/i, '') : ''));
        else if (s.state === 'not_set') setStatus('warn', 'No AI set up yet');
        else setStatus('bad', "Can't reach the AI");
      } catch { setStatus('bad', 'BEYOND is not responding'); }
    }

    function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
    });

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = ''; autoGrow();
      bubble('user', text);
      history.push({ role: 'user', content: text });
      send.disabled = true;
      const waiting = bubble('assistant thinking', '');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }),
        });
        const data = await response.json();
        waiting.remove();
        if (response.ok) {
          bubble('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        } else {
          bubble('error', data.error || 'Something went wrong.');
          history.pop();   // the question wasn't answered, so don't send it again as if it had been
          refreshStatus();
        }
      } catch {
        waiting.remove();
        bubble('error', 'BEYOND is not responding. Is it still running?');
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    refreshStatus();
    setInterval(refreshStatus, 30000);
    input.focus();
  </script>
</body>
</html>
