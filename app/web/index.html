<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEYOND</title>
  <style>
    :root {
      --bg: #f6f4f1; --panel: #ffffff; --text: #1d1b19; --muted: #6b6560; --accent: #d9622b; --accent-text: #ffffff;
      --ok: #2f8f4e; --warn: #c08a1b; --bad: #c0392b; --border: #e6e1db; --bubble: #ffffff; --error-bg: #fbecea;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141210; --panel: #1b1916; --text: #f1ece6; --muted: #a39b93; --accent: #e8743a;
              --accent-text: #ffffff; --ok: #5cc27e; --warn: #e0b04a; --bad: #e57368; --border: #2e2a26;
              --bubble: #221f1b; --error-bg: #3a2220; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 15px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; letter-spacing: 0.18em; color: var(--accent); font-size: 1.15rem; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem;
              min-width: 0; }
    .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
    #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
    .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .welcome { text-align: center; color: var(--muted); margin: 12vh auto 0; max-width: 460px; line-height: 1.5; }
    .welcome h1 { color: var(--text); font-size: 1.4rem; margin: 0 0 6px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
           white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--accent); color: var(--accent-text);
            border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bubble); border: 1px solid var(--border);
                 border-bottom-left-radius: 4px; }
    .error { align-self: center; background: var(--error-bg); color: var(--text); border: 1px solid var(--bad);
             font-size: 0.9rem; max-width: 95%; }
    .thinking { color: var(--muted); }
    .thinking::after { content: '…'; display: inline-block; animation: pulse 1.2s infinite; }
    .writing::after { content: '▍'; margin-left: 1px; color: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .note { display: block; margin-top: 6px; font-size: 0.8rem; color: var(--muted); font-style: italic; }
    .right { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .ghost { padding: 6px 12px; background: transparent; color: var(--text); border: 1px solid var(--border);
             font-weight: 500; font-size: 0.85rem; border-radius: 10px; }
    .ghost:hover { border-color: var(--accent); }
    button.stop { background: var(--bad); }
    form { padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--border); }
    .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; max-height: 200px; overflow-y: auto; scrollbar-width: thin;
      padding: 10px 12px; border-radius: 12px; font: inherit;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); line-height: 1.4;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      padding: 10px 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="brand">BEYOND</div>
    <div class="right">
      <div class="status" title="AI server status"><span class="dot" id="dot"></span><span id="status">Checking the AI…</span></div>
      <button class="ghost" id="newchat" type="button">New chat</button>
    </div>
  </header>
  <main id="log"><div class="inner" id="messages">
    <div class="welcome" id="welcome">
      <h1>Hi, I'm BEYOND.</h1>
      Ask me anything. I run entirely on your own computer.
    </div>
  </div></main>
  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message BEYOND…" aria-label="Message"
                title="Enter sends · Shift+Enter starts a new line"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
  <script>
    let history = [];     // this chat's messages; saving chats arrives in Phase 5
    let current = null;   // the reply being written: { controller, stopped }
    const $ = id => document.getElementById(id);
    const log = $('log'), list = $('messages'), input = $('input'), send = $('send');
    const welcomeHTML = $('welcome').outerHTML;

    function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
    function scrollDown(force) { if (force || nearBottom()) log.scrollTop = log.scrollHeight; }

    function bubble(kind, text) {
      $('welcome')?.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      el.textContent = text;   // plain text on purpose: nothing the AI writes is run as HTML
      list.appendChild(el);
      scrollDown(true);
      return el;
    }

    function addNote(el, text) {
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = text;
      el.appendChild(note);
    }

    function setBusy(busy) {
      send.textContent = busy ? 'Stop' : 'Send';
      send.classList.toggle('stop', busy);
      send.type = busy ? 'button' : 'submit';
      send.title = busy ? 'Stop the answer (Esc)' : '';
    }

    function stop() { if (current) { current.stopped = true; current.controller.abort(); } }

    function setStatus(state, text) {
      $('dot').className = 'dot ' + state;
      $('status').textContent = text;
    }

    async function refreshStatus() {
      try {
        const s = await (await fetch('/api/ai-status')).json();
        if (s.state === 'ok') setStatus('ok', 'AI connected' + (s.model ? ' · ' + s.model.replace(/\.gguf$/i, '') : ''));
        else if (s.state === 'not_set') setStatus('warn', 'No AI set up yet');
        else setStatus('bad', "Can't reach the AI");
      } catch { setStatus('bad', 'BEYOND is not responding'); }
    }

    function autoGrow() {
      input.style.height = 'auto';
      const needed = input.scrollHeight + 2;   // + the 1px top and bottom border
      input.style.height = Math.min(needed, 200) + 'px';
      input.style.overflowY = needed > 200 ? 'auto' : 'hidden';   // a scrollbar only once the box is full
    }
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!current) $('form').requestSubmit(); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });
    send.addEventListener('click', e => { if (current) { e.preventDefault(); stop(); } });

    $('newchat').addEventListener('click', () => {
      stop();
      history = [];
      list.innerHTML = welcomeHTML;
      input.value = ''; autoGrow(); input.focus();
    });

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || current) return;
      input.value = ''; autoGrow();
      bubble('user', text);
      history.push({ role: 'user', content: text });
      const chat = history;   // if New chat is pressed meanwhile, this answer belongs to the old chat
      const reply = bubble('assistant thinking', '');
      current = { controller: new AbortController(), stopped: false };
      const mine = current;
      setBusy(true);
      let answer = '', problem = null;
      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chat }), signal: mine.controller.signal,
        });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let newline;
          while ((newline = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, newline).trim();
            buffer = buffer.slice(newline + 1);
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === 'token') {
              const follow = nearBottom();
              if (!answer) reply.className = 'msg assistant writing';
              answer += event.text;
              reply.textContent = answer;
              if (follow) scrollDown(true);
            } else if (event.type === 'error') {
              problem = event.message;
            }
          }
        }
      } catch (err) {
        if (!mine.stopped) problem = 'BEYOND is not responding. Is it still running?';
      } finally {
        reply.classList.remove('writing', 'thinking');
        if (answer) {
          if (mine.stopped) addNote(reply, 'Stopped');
          chat.push({ role: 'assistant', content: answer });   // a stopped answer still counts as said
        } else {
          reply.remove();
          if (mine.stopped && chat === history && list.lastElementChild) {
            addNote(list.lastElementChild, 'Stopped before the AI started answering');
          }
          chat.pop();   // nothing was answered, so don't send the question again as if it had been
        }
        if (problem && chat === history) { bubble('error', problem); refreshStatus(); }
        if (current === mine) current = null;
        setBusy(false);
        input.focus();
      }
    });

    refreshStatus();
    setInterval(refreshStatus, 30000);
    autoGrow();
    input.focus();
  </script>
</body>
</html>
